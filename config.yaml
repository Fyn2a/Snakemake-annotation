# config.yaml
# Paths are relative to the repository root so the workflow is portable.
# External tools (ANNOVAR, ClassifyCNV) are not bundled here — see README.md.
genome_build: "hg19"
input_vcf: "input/TEST-1_CNV1.cnv.vcf"
output_dir: "FinalOUT"
classifycnv_script: "ClassifyCNV/ClassifyCNV.py"
annovar_dir: "annovar"
merge_script: "merge.py"
bed_script: "vcf2bed.py"
